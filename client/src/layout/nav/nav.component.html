<header
  class="p-3 w-full fixed top-0 z-50 bg-gradient-to-r from-primary to-black"
>
  <div class="flex align-middle items-center px-10 mx-auto gap-6">
    <a
      class="flex items-center gap-3 max-h-16 text-white border-r-white border-r-2 pr-6"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="size-6"
      >
        <path
          d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"
        />
      </svg>
      <h3 class="text-2xl font-semibold text-white uppercase">Dating App</h3>
    </a>
    <nav class="flex gap-3 my-2 uppercase text-lg text-white">
      <a>Matches</a>
      <a>Lists</a>
      <a>Mesages</a>
    </nav>
    <div class="flex align-middle ml-auto gap-3">
      <!-- temlate-driven forms -->
      <!-- @ngForm is a way of adding template reference -->
      <!-- when you import formsmodule it gets binded to form automaically -->
      <!-- and what this code does is that it exports the values of form to ngForm variable
      thus making it accessible to use elsewhere in the template code -->

      <!-- ngModel: This Angular directive is the bridge. It binds to the <input> element's value property and listens for the input event, enabling the two-way flow described above.

      name attribute: In template-driven forms, the name attribute (name="email", name="password") is required on every form control using ngModel. Angular uses this name to register the control with the parent NgForm directive (#loginForm="ngForm"), allowing it to track the value and validation state of that specific control -->
      @if (this.accountService.currentUser(); as user) {
      <div class="dropdown dropdown-end">
        <div
          tabindex="0"
          role="button"
          class="flex items-center text-white text-xl gap-3 cursor-pointer"
        >
          <img
            src="/user.png"
            alt="user picture"
            class="w-8 h-8 rounded-full"
          />
          <span>{{ user.displayName }}</span>
        </div>
        <ul
          tabindex="-1"
          class="dropdown-content dropdown-end menu bg-base-100 z-1 w-52"
        >
          <li><a>Edit profile</a></li>
          <li><a (click)="logout()">logout</a></li>
        </ul>
      </div>
      } @else {
      <form
        #loginForm="ngForm"
        class="flex items-center gap-3"
        (ngSubmit)="login()"
      >
        <input
          [(ngModel)]="creds.email"
          name="email"
          type="email"
          class="input"
          placeholder="Email"
        />
        <input
          [(ngModel)]="creds.password"
          name="password"
          type="password"
          class="input"
          placeholder="Password"
        />
        <button type="submit" class="btn">Login</button>
      </form>
      }
    </div>
  </div>
</header>
