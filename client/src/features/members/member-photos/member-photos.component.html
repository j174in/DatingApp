<!-- @if(!memberSerive.editMode()) { @if(photos$ | async; as photos) { -->
@if(!memberService.editMode()) { @if(photos(); as photos) { @if(photos.length >
0) {
<div class="grid grid-cols-4 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
  @for (photo of photos; track photo.id) {
  <div class="relative">
    <img
      src="{{ photo.url }}"
      alt="photo of member"
      class="rounded-lg w-full"
      [class.opacity-30]="!photo.isApproved"
    />
    @if (!photo.isApproved) {
    <div class="absolute bottom-2 badge badge-outline badge-error">
      Awaiting approval
    </div>
    } @if(accountService.currentUser()?.id === memberService.member()?.id){
    <app-star-button
      (clickEvent)="setMainPhoto(photo)"
      [disabled]="
        photo.url === memberService.member()?.imageUrl || !photo.isApproved
      "
      [selected]="photo.url === memberService.member()?.imageUrl"
      class="absolute top-1 right-1"
    ></app-star-button>
    <app-delete-button
      [disabled]="photo.url == memberService.member()?.imageUrl"
      (clickEvent)="deletePhoto(photo.id)"
      class="absolute top-1 left-1"
    ></app-delete-button>
    }
  </div>
  }
</div>
} @else {
<p class="text-center text-gray-500">No photos available</p>
}
<!-- @for (photo of PhotoMocks; track $index) {
      <img src="{{ photo.url }}" alt="photo of member" class="rounded-lg w-full" />
      } -->
} } @else {
<app-image-upload
  (uploadFile)="onUploadImage($event)"
  [loading]="loading()"
></app-image-upload>
}
