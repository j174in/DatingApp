@if(paginatedResult(); as paginatedResult){
<div class="flex flex-col w-full">
  <div class="flex justify-between items-center">
    <div class="tab tabs-box tabs-lg text-primary w-fit">
      @for(tab of tabs; track $index){
      <button
        class="tab"
        role="tab"
        [class.tab-active]="this.likeParams.predicate === tab.value"
        (click)="setPredicate(tab.value)"
      >
        {{ tab.label }}
      </button>
      }
    </div>
    @if(paginatedResult.metadata; as metadata) {
    <app-paginator
      [pageNumber]="metadata.currentPage"
      [pageSize]="metadata.pageSize"
      [totalCount]="metadata.count"
      [totalPages]="metadata.totalPages"
      (pageChange)="OnPageChange($event)"
    ></app-paginator
    >}
  </div>

  @if(paginatedResult.items; as members){ @if(members.length > 0) {
  <div class="grid grid-cols-5 gap-6 mt-3">
    @for(member of members; track $index){
    <app-member-card [member]="member"></app-member-card>
    }
  </div>
  } @else{
  <div class="mt-3 text-lg">There are no result for this filter</div>
  } }
</div>
}
